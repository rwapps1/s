<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<style>
  :root {
    --bg: #eef3fa;
    --card: #ffffff;
    --border: #dbe6f2;
    --text: #223047;
    --muted: #6b7c93;
    --accent: #3b6ea5;
    --accent-soft: #e4edf8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 60px 20px;
    color: var(--text);
  }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 48px;
  }
  .brand-icon {
    width: 42px;
    height: 42px;
    padding: 8px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .page-header h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  #status {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .grid {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
    margin: 0 auto;
  }
  a.tile {
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 170px;
    padding: 28px 18px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(59, 110, 165, 0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.tile:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(59, 110, 165, 0.14);
  }
  .tile .icon {
    font-size: 40px;
    display: block;
    margin-bottom: 14px;
  }
  .tile .label {
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="page-header">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a4 4 0 1 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1a1 1 0 0 1-1.4 0l-1-1a1 1 0 0 1 0-1.4z"/>
    </svg>
    <h1>Tools</h1>
  </div>

  <div id="status">Loading tools&hellip;</div>
  <div class="grid" id="grid"></div>

<script>
  // ---- Configuration: adjust if the repo owner/name differ ----
  const OWNER = "rwapps1";
  const REPO = "tools";
  const PATH = ""; // folder within the repo where the tool pages live ("" = repo root)
  const BASE_URL = `https://${OWNER}.github.io/${REPO}/`;

  // Optional: keyword -> icon overrides. Add entries here for finer control.
  const ICON_RULES = [
    [/pdf/i, "\ud83d\udcc4"],
    [/adviser|advisor/i, "\ud83d\udc65"],
    [/email|mail/i, "\u2709\ufe0f"],
    [/csv|sheet|excel|spreadsheet/i, "\ud83d\udcca"],
    [/calc/i, "\ud83e\uddee"]
  ];
  const DEFAULT_ICON = "\ud83d\udd27";

  // Used only if the live GitHub API call fails (e.g. rate-limited) so the
  // page still shows something useful. Update this if you add tools and
  // want them to appear even during a rate-limited moment.
  const FALLBACK_FILES = ["adviser-merge-tool.html", "pdf-merge-tool.html"];

  function iconFor(filename) {
    for (const [pattern, icon] of ICON_RULES) {
      if (pattern.test(filename)) return icon;
    }
    return DEFAULT_ICON;
  }

  function humanize(filename) {
    const base = filename.replace(/\.html?$/i, "");
    return base
      .split(/[-_]+/)
      .map(w => (w.toLowerCase() === "pdf" ? "PDF" : w.charAt(0).toUpperCase() + w.slice(1)))
      .join(" ");
  }

  function tileHTML(filename) {
    const label = humanize(filename);
    const icon = iconFor(filename);
    const url = BASE_URL + filename;
    return `<a class="tile" href="${url}">
              <span class="icon">${icon}</span>
              <span class="label">${label}</span>
            </a>`;
  }

  async function loadTools() {
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`);
      if (!res.ok) throw new Error("GitHub API responded with " + res.status);
      const files = await res.json();

      const htmlFiles = files.filter(f =>
        f.type === "file" &&
        f.name.toLowerCase().endsWith(".html") &&
        f.name.toLowerCase() !== "index.html"
      );

      if (htmlFiles.length === 0) {
        status.textContent = "No tools found in the repository yet.";
        return;
      }

      htmlFiles.sort((a, b) => a.name.localeCompare(b.name));
      status.textContent = "";
      grid.innerHTML = htmlFiles.map(f => tileHTML(f.name)).join("");
    } catch (err) {
      console.error(err);
      status.textContent = "Showing the last known tools \u2014 live updates are temporarily unavailable (GitHub API rate limit). Refresh in a bit to check for anything new.";
      grid.innerHTML = FALLBACK_FILES.map(f => tileHTML(f)).join("");
    }
  }

  loadTools();
</script>

</body>
</html>
