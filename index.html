<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared</title>

<!--
  HOW THIS PAGE WORKS
  --------------------
  This page has no build step and no page list to maintain. On load it asks
  the GitHub API for the contents of the repository it is currently being
  served from, and turns every .html file (and every subfolder) it finds
  into a tile below. Add a new page to the repo, refresh this page, and a
  new tile appears automatically -- nothing in this file needs to change.

  It figures out which repository to ask about from the URL it's running
  on (works for both project pages like username.github.io/my-repo/ and
  user pages like username.github.io/). If you're using a custom domain,
  or testing locally, auto-detection won't have a github.io hostname to
  read -- just set it explicitly below and it'll be used instead:

    <meta name="github-repo" content="your-username/your-repo-name">

  Copy this file into any other repository as-is and it will pick up
  that repository's own files and icons the next time it loads.
-->
<meta name="github-repo" content="">

<style>
  :root {
    --sky-50:  #f4f9fd;
    --sky-100: #e7f1fa;
    --sky-200: #d3e6f6;
    --sky-300: #b8d7ef;
    --slate-600: #4a6f9c;
    --slate-700: #365780;
    --ink:  #2c3e50;
    --mist: #8ea6bf;
    --card-shadow: rgba(74, 111, 156, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-50) 0%, var(--sky-100) 55%, var(--sky-200) 100%);
    padding: 64px 20px 40px;
  }

  header {
    text-align: center;
    max-width: 700px;
    margin: 0 auto 40px;
  }

  h1 {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 6vw, 3.2rem);
    letter-spacing: 0.5px;
    color: var(--slate-700);
  }

  .wave {
    display: block;
    width: 220px;
    height: 18px;
    margin: 18px auto 0;
  }
  .wave path {
    fill: none;
    stroke: url(#waveGradient);
    stroke-width: 2.5;
    stroke-linecap: round;
  }

  .subtitle {
    margin-top: 14px;
    color: var(--mist);
    font-size: 0.95rem;
    letter-spacing: 0.2px;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 22px;
  }

  .card {
    background: #ffffff;
    border-radius: 18px;
    padding: 28px 14px 20px;
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 4px 16px var(--card-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
  }
  .card:nth-child(1) { animation-delay: 0.02s; }
  .card:nth-child(2) { animation-delay: 0.06s; }
  .card:nth-child(3) { animation-delay: 0.10s; }
  .card:nth-child(4) { animation-delay: 0.14s; }
  .card:nth-child(5) { animation-delay: 0.18s; }
  .card:nth-child(n+6) { animation-delay: 0.20s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 12px 26px var(--card-shadow);
  }
  .card:focus-visible {
    outline: 2px solid var(--slate-600);
    outline-offset: 3px;
  }
  .card {
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .icon-wrap {
    width: 58px;
    height: 58px;
    border-radius: 15px;
    background: var(--sky-200);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-wrap svg {
    width: 28px;
    height: 28px;
    stroke: var(--slate-700);
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card-name {
    font-size: 0.92rem;
    font-weight: 500;
    word-break: break-word;
    line-height: 1.3;
  }

  .status {
    text-align: center;
    color: var(--mist);
    font-size: 0.95rem;
    max-width: 460px;
    margin: 20px auto 0;
    line-height: 1.5;
  }
  .status.error { color: #a9695f; }

  footer {
    text-align: center;
    margin-top: 70px;
    color: var(--mist);
    font-size: 0.78rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .card {
      animation: none;
      opacity: 1;
      transform: none;
      transition: none;
    }
    .card:hover, .card:focus-visible {
      transform: none;
    }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="waveGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8d7ef"/>
      <stop offset="1" stop-color="#4a6f9c"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <h1>Shared</h1>
  <svg class="wave" viewBox="0 0 220 18" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 9c18-12 36 12 54 0s36-12 54 0 36 12 54 0 36-12 54 0"/>
  </svg>
  <div class="subtitle" id="subtitle">Finding pages&hellip;</div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>Drop a new .html file or folder into this repository and it will show up here automatically.</footer>

<script>
(function () {
  const grid = document.getElementById('grid');
  const subtitle = document.getElementById('subtitle');

  // ---- Icon library: keyword -> inline SVG (first match wins) ----
  const ICONS = [
    { keys: ['photo','gallery','image','picture','pictures','pics'],
      svg: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg>' },
    { keys: ['video','movie','film','clip'],
      svg: '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9l5-3v12l-5-3"/></svg>' },
    { keys: ['music','audio','song','sound','podcast'],
      svg: '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>' },
    { keys: ['blog','post','article','journal','diary','writing'],
      svg: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>' },
    { keys: ['resume','cv','report','doc','document','paper'],
      svg: '<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>' },
    { keys: ['contact','mail','email'],
      svg: '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 6 10-6"/></svg>' },
    { keys: ['about','info','profile','bio'],
      svg: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>' },
    { keys: ['project','portfolio','work','case'],
      svg: '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' },
    { keys: ['game','games','play','arcade'],
      svg: '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M8 10v4"/><path d="M6 12h4"/><circle cx="16" cy="10.5" r="1"/><circle cx="18" cy="13.5" r="1"/></svg>' },
    { keys: ['map','travel','trip','location','places'],
      svg: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>' },
    { keys: ['code','dev','api','script'],
      svg: '<svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3"/><path d="M16 9l4 3-4 3"/><path d="M13 6l-2 12"/></svg>' },
    { keys: ['calendar','schedule','event','plan'],
      svg: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 10h18"/></svg>' },
    { keys: ['shop','store','shopping','cart'],
      svg: '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L23 6H6"/></svg>' },
    { keys: ['book','library','read','story','stories'],
      svg: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>' },
    { keys: ['chart','data','stats','analytics','dashboard'],
      svg: '<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>' },
    { keys: ['recipe','food','cook','kitchen','menu'],
      svg: '<svg viewBox="0 0 24 24"><path d="M18 2v8a2 2 0 0 1-2 2h0"/><path d="M16 2v20"/><path d="M8 2v6a2 2 0 0 0 2 2 2 2 0 0 0 2-2V2"/><path d="M10 10v12"/></svg>' }
  ];
  const FOLDER_SVG  = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const DEFAULT_SVG = '<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>';

  function pickIcon(name, isDir) {
    const lower = name.toLowerCase();
    for (const entry of ICONS) {
      if (entry.keys.some(k => lower.includes(k))) return entry.svg;
    }
    return isDir ? FOLDER_SVG : DEFAULT_SVG;
  }

  function toTitle(name) {
    return name
      .replace(/\.(html?|htm)$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase())
      .trim();
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Files/folders we never want to show as a tile.
  const SKIP_FILES = new Set(['index.html', 'readme.md', 'license', 'license.md', '_config.yml', 'cname', '.nojekyll', '404.html']);
  const SKIP_DIRS  = new Set(['assets', 'css', 'js', 'images', 'img', 'static', 'node_modules', '.github', '.git', 'fonts']);

  function detectRepo() {
    const override = document.querySelector('meta[name="github-repo"]');
    if (override && override.content && override.content.includes('/')) {
      const [owner, repo] = override.content.trim().split('/');
      return { owner, repo };
    }
    const host = window.location.hostname;
    if (host.endsWith('.github.io')) {
      const owner = host.split('.')[0];
      const parts = window.location.pathname.split('/').filter(Boolean);
      const repo = parts.length > 0 ? parts[0] : (owner + '.github.io');
      return { owner, repo };
    }
    return null;
  }

  function showStatus(msg, isError) {
    const el = document.createElement('div');
    el.className = 'status' + (isError ? ' error' : '');
    el.textContent = msg;
    grid.parentNode.appendChild(el);
  }

  async function loadItems() {
    const info = detectRepo();
    if (!info) {
      subtitle.textContent = '';
      showStatus('Could not detect a repository from this URL. If you\'re using a custom domain or testing locally, set <meta name="github-repo" content="owner/repo"> in the page head.', true);
      return;
    }

    try {
      const res = await fetch('https://api.github.com/repos/' + info.owner + '/' + info.repo + '/contents/');
      if (!res.ok) {
        subtitle.textContent = '';
        if (res.status === 403) {
          showStatus('GitHub API rate limit reached. Try refreshing again in a little while.', true);
        } else if (res.status === 404) {
          showStatus('Repository "' + info.owner + '/' + info.repo + '" wasn\'t found, or isn\'t public.', true);
        } else {
          showStatus('Could not load the repository contents right now.', true);
        }
        return;
      }

      const contents = await res.json();
      const items = contents.filter(item => {
        const lower = item.name.toLowerCase();
        if (item.type === 'file') {
          if (SKIP_FILES.has(lower)) return false;
          return /\.html?$/i.test(item.name);
        }
        if (item.type === 'dir') {
          if (SKIP_DIRS.has(lower) || lower.startsWith('.')) return false;
          return true;
        }
        return false;
      }).sort((a, b) => a.name.localeCompare(b.name));

      if (items.length === 0) {
        subtitle.textContent = '';
        showStatus('No pages here yet. Add an .html file (or a folder with its own index.html) to this repository to see it appear here.', false);
        return;
      }

      subtitle.textContent = items.length + ' page' + (items.length === 1 ? '' : 's');

      grid.innerHTML = items.map(item => {
        const isDir = item.type === 'dir';
        const href = isDir ? encodeURIComponent(item.name) + '/' : encodeURIComponent(item.name);
        const title = escapeHtml(toTitle(item.name));
        const svg = pickIcon(item.name, isDir);
        return '<a class="card" href="' + href + '" target="_blank" rel="noopener noreferrer">' +
                 '<span class="icon-wrap">' + svg + '</span>' +
                 '<span class="card-name">' + title + '</span>' +
               '</a>';
      }).join('');

    } catch (err) {
      subtitle.textContent = '';
      showStatus('Something went wrong loading the repository. Check your connection and try again.', true);
    }
  }

  loadItems();
})();
</script>

</body>
</html>
